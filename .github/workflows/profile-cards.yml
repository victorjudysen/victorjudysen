name: Profile cards

# Redraws assets/whoami.svg and assets/contributions.svg from the GitHub
# contribution calendar. Scheduled runs only happen on the default branch.
on:
  schedule:
    - cron: "15 21 * * *" # 00:15 East Africa Time, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate.py"
      - "assets/avatar-source.jpg"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Draw the cards
        env:
          # Optional PROFILE_TOKEN secret (a classic token with read:user)
          # counts private contributions even if they're hidden on the profile.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet pillow
          python scripts/generate.py --login "${{ github.repository_owner }}"

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/whoami.svg assets/contributions.svg
          git diff --cached --quiet && exit 0
          git commit -m "Refresh profile cards"
          git push
